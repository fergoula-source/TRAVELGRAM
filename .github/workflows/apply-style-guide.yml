name: Apply Travelgram style guide

on:
  push:
    branches:
      - travelgram-style-helper
    paths:
      - '.github/workflows/apply-style-guide.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout student main
        uses: actions/checkout@v4
        with:
          ref: main
          path: student
          fetch-depth: 0

      - name: Checkout official target
        uses: actions/checkout@v4
        with:
          repository: rocketseat-education/travelgram
          ref: 6fd3aed6c89ea24824cedce32217ff63f0886a18
          path: official
          persist-credentials: false

      - name: Sync exact target and commit
        run: |
          cd student
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          rsync -a --exclude='.git' ../official/ ./
          git add -A
          git config user.name "fergoula-source"
          git config user.email "228110272+fergoula-source@users.noreply.github.com"
          git commit -m "Iniciando o style guide do projeto"
          git push origin HEAD:main
